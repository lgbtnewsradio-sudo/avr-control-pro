<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AVR Control — Mini</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { background: transparent; }
  .mini-app {
    display: flex; flex-direction: column;
    border-radius: 12px; overflow: hidden;
    border: 1px solid #000;
    background:
      repeating-linear-gradient(0deg,
        rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px,
        rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px),
      linear-gradient(180deg, #2b2f33 0%, #1c2023 16%, #121517 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 34px rgba(0,0,0,0.7);
  }
  .mini-bar {
    height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 12px;
    -webkit-app-region: drag;
  }
  .mini-bar .logo { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: #dfe3e6; }
  .mini-bar .led { width: 7px; height: 7px; border-radius: 50%; background: #3a3f44; }
  .mini-bar .led.ok { background: var(--vfd); box-shadow: 0 0 7px var(--vfd-glow); }
  .mini-bar .led.warn { background: #ffb547; box-shadow: 0 0 7px rgba(255,181,71,0.6); }
  .mini-bar .led.bad { background: var(--danger); box-shadow: 0 0 7px rgba(255,95,86,0.7); }
  .mini-bar .spacer { flex: 1; }
  .mini-bar button { -webkit-app-region: no-drag; width: 28px; height: 24px; border: none;
    border-radius: 5px; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 11px; }
  .mini-bar button:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .mini-bar button.close:hover { background: var(--danger); }
  .mini-bar button.on { color: var(--vfd); }

  .mini-body { padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 9px; }
  .mini-vfd .vfd-glass { padding: 7px 12px 6px; }
  .mini-vfd .vfd-vol .num { font-size: 20px; }
  .mini-vfd .vfd-main { font-size: 13px; height: 20px; letter-spacing: 1.8px; }

  .mini-row { display: flex; gap: 7px; align-items: center; }
  .mini-row .btn { padding: 7px 9px; font-size: 10.5px; }
  .mini-row select { flex: 1; }

  .mini-vol { display: grid; grid-template-columns: 34px 1fr 34px 52px; gap: 7px; align-items: center; }
  .mini-vol .btn { padding: 6px 0; }
  .mini-vol .num { font-family: Consolas, monospace; font-size: 15px; font-weight: 700;
    color: var(--vfd); text-shadow: 0 0 8px var(--vfd-glow); text-align: right; }

  .mini-player { display: none; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; }
  .mini-player.show { display: grid; }
  .mini-art { width: 96px; height: 96px; border-radius: 6px; overflow: hidden;
    background: #0a0c0d; border: 1px solid #000;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 3px 10px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; color: #2c3237; font-size: 30px; }
  .mini-art img { width: 100%; height: 100%; object-fit: cover; }
  .mini-meta { min-width: 0; }
  .mini-meta .svc { font-size: 8px; letter-spacing: 1.8px; font-weight: 700; color: #1DB954; }
  .mini-meta .title { font-size: 13px; font-weight: 700; color: #eef1f3; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .mini-meta .artist { font-size: 11px; color: var(--text-dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
  .mini-meta .transport { display: flex; gap: 6px; }
  .mini-meta .transport .btn { width: 34px; height: 30px; padding: 0; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; }
  .mini-prog { height: 3px; border-radius: 2px; background: #0b0d0f; margin-top: 6px; overflow: hidden; }
  .mini-prog .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #1DB954, #55ff86); }
  .collapsible { display: flex; flex-direction: column; gap: 9px; }
  .collapsed .collapsible { display: none; }
</style>
</head>
<body>
<div class="mini-app" id="miniApp">
  <div class="mini-bar">
    <span class="logo">AVR</span>
    <span class="led" id="connLed" role="status" aria-live="polite"></span><span id="connText" style="display:none;"></span>
    <div class="spacer"></div>
    <button id="btnPin" aria-label="Keep window on top" title="Always on top">&#x1F4CC;</button>
    <button id="btnCollapse" aria-label="Collapse window" title="Collapse">&#x2B0D;</button>
    <button id="btnFull" aria-label="Switch to full view" title="Full view">&#x26F6;</button>
    <button class="close" id="wClose" aria-label="Close window">&#x2715;</button>
  </div>
  <div class="mini-body">
    <div class="mini-vfd" id="vfdHost" role="img" aria-label="Receiver front panel display"></div>

    <div class="mini-vol">
      <button class="btn" data-cmd="MVLDOWN" aria-label="Volume down">&#x2212;</button>
      <input type="range" id="mVol" min="0" max="82" value="0" aria-label="Master volume">
      <button class="btn" data-cmd="MVLUP" aria-label="Volume up">+</button>
      <span class="num" id="mVolNum">--</span>
    </div>

    <div class="collapsible">
      <div class="mini-row">
        <button class="btn" id="btnPower" aria-label="Main power">&#x23FB;</button>
        <select id="mInput" aria-label="Input source"></select>
        <button class="btn" id="btnMute" aria-label="Mute">MUTE</button>
      </div>

      <div class="mini-player" id="miniPlayer">
        <div class="mini-art" id="mArt" aria-hidden="true">&#x266B;</div>
        <div class="mini-meta">
          <div class="svc" id="mSvc">SPOTIFY CONNECT</div>
          <div class="title" id="mTitle">—</div>
          <div class="artist" id="mArtist"></div>
          <div class="transport">
            <button class="btn" data-cmd="NTCTRDN" aria-label="Previous track">&#x23EE;</button>
            <button class="btn" id="btnPlayPause" aria-label="Play or pause">&#x25B6;</button>
            <button class="btn" data-cmd="NTCTRUP" aria-label="Next track">&#x23ED;</button>
            <button class="btn" id="btnShuffle" aria-label="Shuffle" data-cmd="NTCRANDOM">&#x1F500;</button>
            <button class="btn" id="btnRepeat" aria-label="Repeat" data-cmd="NTCREPEAT">&#x1F501;</button>
          </div>
          <div class="mini-prog"><div class="fill" id="mFill"></div></div>
        </div>
      </div>

      <div class="mini-row">
        <button class="btn" data-cmd="LMDAUTO" style="flex:1;">AUTO</button>
        <button class="btn" data-cmd="LMDMOVIE" style="flex:1;">MOVIE</button>
        <button class="btn" data-cmd="LMDMUSIC" style="flex:1;">MUSIC</button>
        <button class="btn" data-cmd="LMDSTEREO" style="flex:1;">STEREO</button>
      </div>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script src="mini.js"></script>
</body>
</html>
